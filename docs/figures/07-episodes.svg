<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 620' width='760' height='620' role='img' aria-labelledby='t d'><title id='t'>From rainy moments to rain episodes</title><desc id='d'>Three examples: a short dry break is bridged, a brief shower is left out, and a long spell is cut into 12-hour episodes; a hindcast is issued every hour inside an episode.</desc><defs><marker id='ahe6ebef' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#e6ebef'/></marker><marker id='ah93a1ae' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#93a1ae'/></marker><marker id='ahf0a030' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#f0a030'/></marker><marker id='ahee7b6c' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#ee7b6c'/></marker><marker id='ah5cc08a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5cc08a'/></marker><marker id='ahb58be8' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#b58be8'/></marker></defs><rect width='760' height='620' fill='#0f151b'/><text x='380.0' y='40' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='24' fill='#e6ebef' text-anchor='middle' font-weight='bold'>From rainy moments to rain episodes</text><text x='380.0' y='70' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#93a1ae' text-anchor='middle' font-weight='normal'>blue: rain on at least 2% of the scoring area · green: a rain episode · dots: a hindcast every hour</text><text x='70' y='110' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='18' 