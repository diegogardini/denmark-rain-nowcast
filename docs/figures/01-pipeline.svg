<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 320' width='600' height='320' role='img' aria-labelledby='t d'><title id='t'>Pipeline</title><desc id='d'>Radar scan to rain-rate map, then the two method-specific steps, measuring the motion and moving the rain, to forecast maps scored against the radar that followed.</desc><defs><marker id='ahe6ebef' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#e6ebef'/></marker><marker id='ah93a1ae' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#93a1ae'/></marker><marker id='ahf0a030' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#f0a030'/></marker><marker id='ahee7b6c' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#ee7b6c'/></marker><marker id='ah5cc08a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5cc08a'/></marker><marker id='ahb58be8' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#b58be8'/></marker></defs><rect width='600' height='320' fill='#0f151b'/><g transform='translate(0,-38)'><!--notitle--><rect x='14' y='56' width='172' height='92' rx='8' fill='#161e26' stroke='#93a1ae' stroke-width='1.8' opacity='1'/><text x='100.0' y='94' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' fill='#e6ebef' text-anchor='middle' font-weight='bold'>Radar scan</text><text x='100.0' y='118' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' fill='#93a1ae' text-anchor='middle' font-weight='normal'>every 10 minutes</text><rect x='214' y='56' width='172' height='92' rx='8' fill='#161e26' stroke='#93a1ae' stroke-width='1.8' opacity='1'/><text x='300.0' y='94' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' fill='#e6ebef' text-anchor='middle' font-weight='bold'>Rain-rate map</text><text x='300.0' y='118' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' fill='#93a1ae' text-anchor='middle' font-weight='normal'>224 x 160 cells</text><rect x='414' y='56' width='172' height='92' rx='8' fill='#2e2410' stroke='#f0a030' stroke-width='1.8' opacity='1'/><text x='500.0' y='94' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' fill='#e6ebef' text-anchor='middle' font-weight='bold'>Measure motion</text><text x='500.0' y='118' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' fill='#93a1ae' text-anchor='middle' font-weight='normal'>from the last scans</text><rect x='414' y='200' width='172' height='92' rx='8' fill='#2e2410' stroke='#f0a030' stroke-width='1.8' opacity='1'/><text x='500.0' y='238' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' fill='#e6ebef' text-anchor='middle' font-weight='bold'>Move the rain</text><text x='500.0' y='262' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' fill='#93a1ae' text-anchor='middle' font-weight='normal'>along the motion</text><rect x='214' y='200' width='172' height='92' rx='8' fill='#161e26' stroke='#93a1ae' stroke-width='1.8' opacity='1'/><text x='300.0' y='238' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' fill='#e6ebef' text-anchor='middle' font-weight='bold'>Forecast maps</text><text x='300.0' y='262' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' fill='#93a1ae' text-anchor='middle' font-weight='normal'>+10 to +360 min</text><rect x='14' y='200' width='172' height='92' rx='8' fill='#161e26' stroke='#93a1ae' stroke-width='1.8' opacity='1'/><text x='100.0' y='238' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' fill='