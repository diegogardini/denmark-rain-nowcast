<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 644' width='600' height='644' role='img' aria-labelledby='t d'><title id='t'>Whole-map vector: two ways</title><desc id='d'>The same block matches are either averaged directly into the whole-map vector, or first repaired by borrowing and filling and then averaged, which gives a slower vector.</desc><defs><marker id='ahe6ebef' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#e6ebef'/></marker><marker id='ah93a1ae' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#93a1ae'/></marker><marker id='ahf0a030' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#f0a030'/></marker><marker id='ahee7b6c' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#ee7b6c'/></marker><marker id='ah5cc08a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5cc08a'/></marker><marker id='ahb58be8' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#b58be8'/></marker></defs><rect width='600' height='644' fill='#0f151b'/><g transform='translate(0,-38)'><!--notitle--><rect x='175.0' y='56' width='250' height='84' rx='8' fill='#161e26' stroke='#93a1ae' stroke-width='1.8' opacity='1'/><text x='300.0' y='88' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' fill='#e6ebef' text-anchor='middle' font-weight='bold'>Match each block</text><text x='300.0' y='110' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' fill='#93a1ae' text-anchor='middle' font-weight='normal'>one vector and a confidence</text><text x='300.0' y='128' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' fill='#93a1ae' text-anchor='middle' font-weight='normal'>per block, for each scan pair</text><line x1='300.0' y1='142' x2='300.0' y2='162' stroke='#e6ebef' stroke-width='2'/><line x1='151.0' y1='162' x2='449.0' y2='162' stroke='#e6ebef' stroke-width='2'/><line x1='151.0' y1='162' x2='151.0' y2='190' stroke='#f0a030' stroke-width='2.5' marker-end='url(#ahf0a030)'/><line x1='449.0' y1='162' x2='449.0' y2='190' stroke='#93a1ae' stroke-width='2' marker-end='url(#ah93a1ae)' stroke-dasharray='6 4'/><rect x='26' y='194' width='250' height='84' rx='8' fill='#2e2410' stroke='#f0a030' stroke-width='1.8' opacity='1'/><text x='151.0' y='226' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' fill='#e6ebef' text-anchor='middle' font-weight='bold'>Weighted average</text><text x='151.0' y='248' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' fill='#93a1ae' text-anchor='middle' font-weight='normal'>of the raw matches;</text><text x='151.0' y='266' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' fill='#93a1ae' text-anchor='middle' font-weight='normal'>empty blocks do not count</text><rect x='26' y='308' width='250' height='84' rx='8' fill='#2e2410' stroke='#f0a030' stroke-width='1.8' opacity='1'/><text x='151.0' y='340' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' fill='#e6ebef' text-anchor='middle' font-weight='bold'>Whole-map vector</text><text x='151.0' y='362' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' fill='#93a1ae' text-anchor='middle' font-weight='normal'>used in the report</text><text x='151.0' y='380' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' fill='#93a1ae' text-anchor='middle' font-weight='normal'>(section 4.3)</text><line x1='151.0' y1='280' x2='151.0' y2='305' stroke='#f0a030' stroke-width='2.5' marker-end='url(#ahf0a030)'/><rect x='324' y='194' wi