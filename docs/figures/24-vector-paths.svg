-serif' font-size='14.5' fill='#93a1ae' text-anchor='middle' font-weight='normal'>block vectors</text><line x1='449.0' y1='394' x2='449.0' y2='419' stroke='#93a1ae' stroke-width='2' marker-end='url(#ah93a1ae)' stroke-dasharray='6 4'/><rect x='324' y='536' width='250' height='84' rx='8' fill='#161e26' stroke='#93a1ae' stroke-width='1.8' opacity='1' stroke-dasharray='6 4'/><text x='449.0' y='568' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' fill='#e6ebef' text-anchor='middle' font-weight='bold'>Whole-map vector</text><text x='449.0' y='590' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' fill='#93a1ae' text-anchor='middle' font-weight='normal'>slower, places rain worse</text><text x='449.0' y='608' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' fill='#93a1ae' text-anchor='middle' font-weight='normal'>(Appendix B.4)</text><line x1='449.0' y1='508' x2='449.0' y2='533' stroke='#93a1ae' stroke-width='2' marker-end='url(#ah93a1ae)' stroke-dasharray='6 4'/><rect x='26' y='645' width='28' height='20' rx='4' fill='#2e2410' stroke='#f0a030' stroke-width='1.8' opacity='1'/><text x='64' y='660' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' fill='#e6ebef' text-anchor='start' font-weight='normal'>used in the report</text><rect x='324' y='645' width='28' height='20' rx='4' fill='#161e26' stroke='#93a1ae' stroke-width='1.8' opacity='1' stroke-dasharray='6 4'/><text x='362' y='660' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' fill='#e6ebef' text-anchor='start' font-weight='normal'>tested in Appendix B.4</text></g></svg>